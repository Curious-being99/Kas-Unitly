name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Check for Release Signing Secrets
      id: check-secrets
      run: |
        if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ] && [ -n "${{ secrets.STORE_PASSWORD }}" ] && [ -n "${{ secrets.KEY_PASSWORD }}" ]; then
          echo "secrets_configured=true" >> $GITHUB_OUTPUT
        else
          echo "secrets_configured=false" >> $GITHUB_OUTPUT
          echo "Release secrets not configured. Building an unsigned Release APK."
        fi

    - name: Decode Keystore
      if: steps.check-secrets.outputs.secrets_configured == 'true'
      run: |
        echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > my-upload-key.jks

    - name: Build Signed Release APK
      if: steps.check-secrets.outputs.secrets_configured == 'true'
      env:
        KEYSTORE_PATH: ../my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      run: gradle :app:assembleRelease --no-daemon

    - name: Build Unsigned Release APK
      if: steps.check-secrets.outputs.secrets_configured == 'false'
      run: gradle :app:assembleRelease --no-daemon

    - name: Upload Unsigned Release APK Artifact
      if: steps.check-secrets.outputs.secrets_configured == 'false'
      uses: actions/upload-artifact@v4
      with:
        name: kas-calculator-unsigned-apk
        path: app/build/outputs/apk/release/app-release-unsigned.apk
        retention-days: 7

    - name: Upload Signed Release APK Artifact
      if: steps.check-secrets.outputs.secrets_configured == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: kas-calculator-release-apk
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 7

